<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="영화 대사와 노래 속 영어 표현을 맥락과 함께 익히는 학습 앱">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Catch a Scene</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFD23F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a home with the search box in the middle, video lessons on the left and the quiz on the right; result, learn and quiz views share one column. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#18213A; --muted:#5B6478; --line:#DCE0E8; --soft:#EBEDF3;
  --marker:#FFD23F; --marker-ink:#18213A; --here:#FFF3C4;
  --screen:#0E1322; --screen-fg:#F4F6FB;
  --good:#1D7F53; --good-bg:#E3F4EB; --bad:#B4410F; --bad-bg:#FBEBE2;
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161B2B; --ink:#E7EAF2; --muted:#9AA3B8; --line:#2A3146; --soft:#1E2436;
  --here:#3A3216; --screen:#05070D; --good:#58C893; --good-bg:#16302A; --bad:#F3936A; --bad-bg:#37201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2B; --ink:#E7EAF2; --muted:#9AA3B8; --line:#2A3146; --soft:#1E2436;
  --here:#3A3216; --screen:#05070D; --good:#58C893; --good-bg:#16302A; --bad:#F3936A; --bad-bg:#37201A; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-block:16px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
a{color:inherit}
mark{background:var(--marker);color:var(--marker-ink);border-radius:3px;padding:0 3px;font-weight:600}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.logo{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo .dot{width:14px;height:14px;border-radius:50%;background:var(--marker);box-shadow:0 0 0 3px var(--ink) inset}
.logo span{background:linear-gradient(transparent 58%,var(--marker) 58%);padding:0 2px;color:var(--ink)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;font-size:14px;font-weight:500;padding:7px 12px;border-radius:999px;color:var(--muted)}
nav a:hover{color:var(--ink);background:var(--soft)}
nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--marker);color:var(--marker-ink);border-radius:999px;padding:1px 7px;margin-left:4px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pad{padding:20px;display:grid;gap:14px;align-content:start}
.label{font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.mark{background:var(--marker);color:var(--marker-ink);border-color:var(--marker);font-weight:600}
.btn[aria-pressed="true"]{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.home{grid-template-columns:minmax(0,1fr)}.home .search{order:-1}}
.search{padding:24px;display:grid;gap:16px}
.search h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;line-height:1.1}
.search h1 span{background:linear-gradient(transparent 60%,var(--marker) 60%);color:var(--ink)}
.tabs{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;justify-self:start}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:grid;gap:5px;font-size:13px;font-weight:600}
.field em{font-style:normal;font-weight:400;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:15px;min-width:0;resize:vertical}
.field textarea{min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ai-state i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.ai-state.on i{background:var(--good)}
.examples{display:flex;flex-wrap:wrap;gap:8px}

.side-card h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini-scenes{display:grid;gap:10px}
.mini{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:0;background:none;padding:0;cursor:pointer}
.mini:hover b{text-decoration:underline}
.mini b{font-size:14px;font-weight:600;display:block}
.mini small{font-size:12px;color:var(--muted)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;
  background:radial-gradient(70% 60% at var(--sx,70%) 0%,rgba(255,255,255,.22),transparent 70%),linear-gradient(160deg,var(--p1,#2B3A67),var(--p2,#0E1322))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;left:8px;bottom:6px;font-family:var(--f-display);font-weight:700;color:#fff;font-size:12px;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.saved-list{list-style:none;margin:0;padding:0;display:grid}
.saved-list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.saved-list li:last-child{border-bottom:0}
.saved-list b{font-weight:600}
.saved-list button.open{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0}
.saved-list button.open:hover b{text-decoration:underline}
.saved-list .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;flex:none}
.big-num{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}

/* result */
.result{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.result{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:20px;min-width:0}
.work h1{font-size:clamp(24px,3vw,32px);font-weight:800}
.quote{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.4;border-left:4px solid var(--marker);padding-left:14px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.meaning{background:var(--here);border-radius:12px;padding:14px 16px;font-weight:500}
.conf{font-family:var(--f-mono);font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.conf.high{color:var(--good);border-color:var(--good)}
.conf.low{color:var(--bad);border-color:var(--bad)}
.parts{display:grid;gap:12px}
.part{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.part .ref{font-family:var(--f-display);font-weight:700}
.dev{display:grid;gap:2px;font-size:14px;padding:8px 10px;background:var(--soft);border-radius:8px}
.dev b{font-weight:600}
.expr-chips{display:flex;flex-wrap:wrap;gap:8px}
.expr-detail{display:grid;gap:12px}
.expr-title{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.6vw,28px);line-height:1.15}
.expr-title span{background:linear-gradient(transparent 60%,var(--marker) 60%);color:var(--ink)}
.means{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.means li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px}
.means li.here{background:var(--here);border-color:transparent}
.means .ex{font-size:14px}
.means .ko{font-size:13px;color:var(--muted)}
.media{display:grid;gap:10px}
.media-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.media-item .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.media-item b{font-weight:600}

/* learn */
.learn{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.learn{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--screen);border-radius:16px;overflow:hidden;color:var(--screen-fg)}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--screen)}
.screen #yt,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{position:absolute;inset:0;display:grid;align-content:end;gap:8px;padding:clamp(16px,4vw,32px);overflow:hidden;
  background:radial-gradient(60% 45% at 50% 108%,rgba(255,240,200,.3),transparent 70%),radial-gradient(38% 70% at var(--sx,72%) -10%,rgba(255,255,255,.2),transparent 70%),linear-gradient(165deg,var(--p1,#2B3A67),var(--p2,#0E1322))}
.poster::before,.poster::after{content:"";position:absolute;left:0;right:0;height:7%;background:#000}
.poster::before{top:0}.poster::after{bottom:0}
.poster .k{font-size:13px;font-weight:600;color:rgba(255,255,255,.8);position:relative}
.poster .q{position:relative;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,4vw,38px);line-height:1.1;color:#fff;max-width:22ch;margin:0}
.poster .f{position:relative;font-size:13px;color:rgba(255,255,255,.88);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:calc(7% - 2px)}
.poster .f a{color:#fff;font-weight:600;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:6px;text-decoration:none}
.caption{padding:14px 18px;display:grid;gap:4px;text-align:center;border-top:1px solid #1f2740;min-height:84px;align-content:center}
.cap-en{font-family:var(--f-display);font-weight:500;font-size:clamp(18px,2.4vw,22px)}
.cap-ko{font-size:14px;color:#AEB8D2}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;background:#0A0E1A;align-items:center}
.cbtn{font-size:13px;font-weight:500;color:var(--screen-fg);background:#1A2238;border:1px solid #2A3452;border-radius:8px;padding:7px 12px;cursor:pointer}
.cbtn:hover{background:#222C48}
.cbtn.primary{background:var(--marker);color:var(--marker-ink);border-color:var(--marker);font-weight:600}
.cbtn[aria-pressed="true"]{background:#2F3B60;border-color:#5466A0}
.controls .sp{flex:1}
.time{font-family:var(--f-mono);font-size:12px;color:#8C97B6;font-variant-numeric:tabular-nums}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lib-card{display:grid;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer}
.lib-card:hover{border-color:var(--ink)}
.lib-card[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink);border-color:var(--ink)}
.lib-card b{font-weight:600;font-size:14px}
.lib-card small{color:var(--muted);font-size:12px}

/* quiz */
.quizwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.quizwrap{grid-template-columns:minmax(0,1fr)}}
.qprog{height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qq{font-family:var(--f-display);font-weight:500;font-size:clamp(19px,2.4vw,23px);line-height:1.4}
.blank{display:inline-block;min-width:5ch;border-bottom:2px solid var(--marker)}
.choices{display:grid;gap:8px}
.choice{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:600}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.fb{font-weight:600;font-size:14px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.score{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#home" aria-label="Catch a Scene 홈"><i class="dot" aria-hidden="true"></i>Catch a <span>Scene</span></a>
    <nav aria-label="주요 화면">
      <a href="#home" data-nav="home">홈</a>
      <a href="#learn" data-nav="learn">영상으로 배우기</a>
      <a href="#quiz" data-nav="quiz">퀴즈<span class="count" id="navCount">0</span></a>
    </nav>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<script>
/* ============ 기본 도구 ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const norm = s => String(s || '').toLowerCase().replace(/[’']/g, "'").replace(/\b(someone|somebody|something|one|oneself)('s)?\b/g, '').replace(/[~()]/g, ' ').replace(/\s+/g, ' ').trim();
const ytId = u => { const m = String(u || '').match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; };
const ytSearch = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
const playphrase = q => 'https://www.playphrase.me/#/search?q=' + encodeURIComponent(q);
const youglish = q => 'https://youglish.com/pronounce/' + encodeURIComponent(q) + '/english';
const cleanExpr = e => String(e || '').replace(/\(.*?\)/g, ' ').replace(/~/g, ' ').replace(/\b(someone's|somebody's|one's)\b/gi, 'his').replace(/\s+/g, ' ').trim();
function highlight(text, expr){
  const t = esc(text); const key = cleanExpr(expr).replace(/\bhis\b/, '');
  const words = key.split(' ').filter(w => w.length > 1).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&#39;/g, "(?:&#39;|’)"));
  if (!words.length) return t;
  const rx = new RegExp(words.join("[\\w&#;’' ]{0,14}?"), 'i');
  return t.replace(rx, m => `<mark>${m}</mark>`);
}

/* ============ 영상 라이브러리 (공식 채널 영상만) ============ */
const SCENES = [
  { id:'jobs-dots', videoId:'UF8uR6Z6KLc', start:200, end:320, tag:'연설 · Stanford', who:'Steve Jobs, 2005 스탠퍼드 졸업식', title:'점들은 나중에 이어진다', poster:['#1F4E5F','#08171C','70%'],
    expr:'connect the dots', meaning:'흩어진 일들 사이의 연결고리를 찾다', keyLine:'connect the dots', keyKo:'점들을 잇다',
    note:'숫자 점을 이어 그림을 완성하는 놀이에서 나온 말이에요. 연설에서는 "지나고 나서야 경험들이 하나로 이어진다"는 뜻으로 써요.',
    examples:[['The detective finally connected the dots.','형사는 마침내 단서들을 이어 맞췄다.'],['Looking back, I can connect the dots in my career.','돌아보니 내 경력의 점들이 이어져 보여.']] },
  { id:'jobs-hungry', videoId:'UF8uR6Z6KLc', start:770, end:880, tag:'연설 · Stanford', who:'Steve Jobs, 2005 스탠퍼드 졸업식', title:'계속 갈망하라', poster:['#5A3A1E','#1A0F07','35%'],
    expr:'stay hungry', meaning:'(안주하지 않고) 계속 더 원하고 도전하다', keyLine:'Stay hungry. Stay foolish.', keyKo:'계속 갈망하라. 계속 무모하라.',
    note:'hungry는 배고픔이 아니라 "더 원하는 마음"이에요. foolish도 "어리석다"보다 남 눈치 보지 않고 도전하는 쪽에 가까워요.',
    examples:[['Even after winning, the team stayed hungry.','우승하고도 그 팀은 안주하지 않았다.'],['Stay hungry and keep learning.','안주하지 말고 계속 배워.']] },
  { id:'urban-nighter', videoId:'arj7oStGLkU', start:20, end:100, tag:'TED · Tim Urban', who:'Inside the Mind of a Master Procrastinator', title:'밤새서 끝낸 논문', poster:['#3A2E6E','#120F24','78%'],
    expr:'all-nighter', meaning:'밤샘 (pull an all-nighter = 밤을 새우다)', keyLine:'two all-nighters', keyKo:'밤샘 두 번',

/* ============ 저장소 (이 브라우저) ============ */
const Store = {
  items:[], subs:new Set(), key:'cas-items-v1',
  load(){ try { this.items = JSON.parse(localStorage.getItem(this.key) || '[]'); } catch (e) { this.items = []; } },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.items)); } catch (e) {} },
  emit(){ this.subs.forEach(f => f()); },
  init(){ this.load(); this.emit(); },
  list(kind){ return this.items.filter(i => i.kind === kind).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); },
  has(id){ return this.items.some(i => i.id === id); },
  get(id){ return this.items.find(i => i.id === id); },
  async put(id, data){
    this.items = this.items.filter(i => i.id !== id).concat(Object.assign({ id }, data, { createdAt: Date.now() }));
    this.save(); this.emit(); return true;
  },
  async remove(id){ this.items = this.items.filter(i => i.id !== id); this.save(); this.emit(); }
};
const exprId = e => 'e-' + hash(norm(e.expr || e));
async function saveExpr(e, source){
  const first = (e.all_meanings || []).find(m => m.here) || (e.all_meanings || [])[0] || {};
  await Store.put(exprId(e), { kind:'expr', expr:e.expr, meaning:e.meaning_here || e.meaning || first.meaning || '', ex_en:first.ex_en || (e.examples && e.examples[0] && e.examples[0][0]) || '', ex_ko:first.ex_ko || (e.examples && e.examples[0] && e.examples[0][1]) || '', all_meanings:(e.all_meanings || []).slice(0, 6), source: source || '' });
}

/* ============ 연결 상태: 서버(api 폴더) ============ */
const api = { ok:false, checked:false, key:false };
const apiReady = (async () => {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch('api/verify?ids=', { signal: ctl.signal }); clearTimeout(t);
    api.ok = r.ok && (r.headers.get('content-type') || '').includes('json');
    if (api.ok) { const k = await fetch('api/ask').then(x => x.json()).catch(() => ({})); api.key = !!k.ready; }
  } catch (e) { api.ok = false; }
  api.checked = true; return api.ok;
})();
let aiMode = 'checking';
(async () => {
  await apiReady;
  aiMode = api.ok ? (api.key ? 'server' : 'nokey') : 'none';
  const el = $('#aiState'); if (el) renderAiState(el);
})();
function renderAiState(el){
  const map = { checking:['AI 연결 확인 중', false], server:['AI 연결됨 · OpenAI', true], none:['AI 미연결 · 예시 결과로 둘러볼 수 있어요', false], nokey:['OpenAI 키 미설정 · README를 확인하세요', false] };
  const [t, on] = map[aiMode]; el.className = 'ai-state' + (on ? ' on' : ''); el.innerHTML = `<i aria-hidden="true"></i>${esc(t)}`;
}

/* 영상 검사: 서버가 있으면 YouTube에 실제로 있는지, 퍼가기가 허용됐는지 확인 */
const broken = new Set((() => { try { return JSON.parse(localStorage.getItem('cas-broken') || '[]'); } catch (e) { return []; } })());
function markBroken(id){ broken.add(id); try { localStorage.setItem('cas-broken', JSON.stringify([...broken])); } catch (e) {} }
const verified = {};
async function verifyIds(ids){
  ids = [...new Set(ids.filter(Boolean))].filter(id => !(id in verified));
  if (!ids.length || !(await apiReady)) return;
  try { const r = await fetch('api/verify?ids=' + ids.join(',')); const j = await r.json(); Object.assign(verified, j); } catch (e) {}
}
let libCheck = 'pending';
(async () => {
  if (!(await apiReady)) { libCheck = 'unavailable'; return; }
  await verifyIds(SCENES.map(s => s.videoId));
  SCENES.forEach(s => { const v = verified[s.videoId]; if (v && !v.ok && [401, 403, 404].includes(v.status)) markBroken(s.videoId); });
  libCheck = 'done'; if (route() === 'learn' || route() === 'home') render();
})();

JSON 형식:
{
  "work": {"title": "노래 제목", "year": "발매 연도", "by": "가수 · 앨범", "summary": "노래 소개 2문장"},
  "background": {"confirmed": "가수가 직접 밝힌 배경 (없으면 빈 문자열)", "interpretation": "평론가와 팬들의 해석"},
  "overall": "노래 전체가 말하려는 것",
  "hidden_meaning": "숨은 의미나 이중적인 의미",
  "parts": [{"ref": "8단어 이하의 짧은 구절 또는 위치 (예: 2절 도입부)", "meaning": "그 부분의 의미", "why": "그 부분을 그렇게 쓴 이유와 배경", "devices": [{"type": "비유|은어|시적 허용|말장난|구어체 축약|문법 파괴", "expr": "해당 표현", "explain": "정확한 의미와 쓴 이유"}]}],
  ${SHARED_EXPR_SCHEMA}
}`;
}
function parseLoose(t){
  t = String(t || '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code:'invalid_json' };
}
async function askAI(mode, q, { signal }){
  if (!(await apiReady)) throw { code:'no_ai' };
  if (!api.key) throw { code:'no_key' };
  const prompt = mode === 'movie' ? moviePrompt(q, true) : songPrompt(q, true);
  const r = await fetch('api/ask', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ prompt, search:true }), signal });
  const j = await r.json().catch(() => ({}));
  if (r.status === 501) throw { code:'no_key' };
  if (r.status === 429) throw { code:'rate_limited' };
  if (!r.ok) throw { code:'upstream_error', message: j.error };
  return parseLoose(j.text);
}
const ERR = {
  rate_limited:'요청이 많거나 OpenAI 사용 한도에 닿았어요. 잠시 후 다시 시도해 주세요.',
  invalid_json:'답을 정리하지 못했어요. 다시 시도해 주세요.',
  no_key:'서버에 OpenAI 키가 설정되지 않았어요. README 안내대로 OPENAI_API_KEY를 넣어 주세요.',
  no_ai:'AI 서버에 연결되지 않았어요. 파일을 그냥 열면 해석 기능이 동작하지 않아요. README 안내대로 Vercel에 배포하거나 server.js로 실행해 주세요. 지금은 예시 결과로 기능을 둘러볼 수 있어요.'
};
function fixResult(mode, r){
  r = r && typeof r === 'object' ? r : {};
  const arr = x => Array.isArray(x) ? x : [];
  r.work = r.work || {}; r.context = r.context || {}; r.background = r.background || {};
  r.expressions = arr(r.expressions).filter(e => e && e.expr).map(e => Object.assign(e, { all_meanings: arr(e.all_meanings).filter(m => m && m.meaning) }));
  r.related_media = arr(r.related_media).filter(m => m && (m.title || m.situation));
  r.parts = arr(r.parts).filter(p => p && (p.meaning || p.ref)).map(p => Object.assign(p, { devices: arr(p.devices) }));
  return r;
}

async function onSearch(e){
  e.preventDefault();
  lastError = '';
  const err = m => { lastError = m; const el = $('#formErr'); el.textContent = m; el.hidden = !m; };
  let q;
  if (tab === 'movie') {
    q = { title: $('#fTitle').value.trim(), line: $('#fLine').value.trim() };
    if (!q.title || !q.line) return err('영화 제목과 대사를 모두 적어 주세요.');
  } else {
    q = { artist: $('#fArtist').value.trim(), song: $('#fSong').value.trim(), part: $('#fPart').value.trim() };
    if (!q.artist || !q.song) return err('가수와 노래 제목을 모두 적어 주세요.');
  }
  err('');
  const mode = tab;
  busy = { ctl: new AbortController() };
  $('#goBtn').disabled = true; $('#stopBtn').hidden = false; $('#status').hidden = false;
  $('#statusText').textContent = mode === 'movie' ? '영화 정보를 찾고 대사를 해석하고 있어요… 30초 정도 걸려요.' : '노래 배경을 찾고 가사를 해석하고 있어요… 30초 정도 걸려요.';
  try {
    const raw = await askAI(mode, q, { signal: busy.ctl.signal });
    busy = null;
    current = { mode, query: q, result: fixResult(mode, raw) };
    go('result');
  } catch (ex) {
    busy = null;
    if (route() !== 'home') return;
    $('#goBtn').disabled = false; $('#stopBtn').hidden = true; $('#status').hidden = true;
    if (ex && ex.code === 'cancelled') return;
    err(ERR[ex && ex.code] || ((ex && ex.message) ? '해석 중 문제가 생겼어요: ' + ex.message : '해석 중 문제가 생겼어요. 다시 시도해 주세요.'));
  }
}

function quizPool(){
  const map = new Map();
  for (const i of Store.list('expr')) map.set(norm(i.expr), { expr: i.expr, meaning: i.meaning, ex_en: i.ex_en, ex_ko: i.ex_ko, source: i.source });
  for (const a of Store.list('analysis')) for (const e of ((a.result && a.result.expressions) || [])) {
    const k = norm(e.expr); if (!k || map.has(k)) continue;
    const m = (e.all_meanings || []).find(x => x.here) || (e.all_meanings || [])[0] || {};
    map.set(k, { expr: e.expr, meaning: e.meaning_here || m.meaning || '', ex_en: m.ex_en || '', ex_ko: m.ex_ko || '', source: a.title });
  }
  return [...map.values()].filter(x => x.expr && x.meaning);
}
const Q = { active:false, list:[], i:0, score:0, answered:false, wrong:[] };
function buildQuestions(pool){
  const others = (field, not) => shuffle(pool.concat(FALLBACK_POOL.map(([expr, meaning]) => ({ expr, meaning }))).filter(x => norm(x.expr) !== norm(not.expr)).map(x => x[field]).filter((v, i, a) => v && a.indexOf(v) === i)).slice(0, 3);
  const qs = [];
  for (const it of shuffle(pool)) {
    const types = ['meaning', 'expr'];
    const blankRx = it.ex_en && new RegExp(cleanExpr(it.expr).split(' ').filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+'), 'i');
    if (blankRx && blankRx.test(it.ex_en)) types.push('blank');
    const t = types[Math.floor(Math.random() * types.length)];
    let q;
    if (t === 'meaning') { const opts = shuffle([it.meaning, ...others('meaning', it)]); q = { html:`‘<b>${esc(it.expr)}</b>’의 뜻은?`, opts, answer: opts.indexOf(it.meaning) }; }
    else if (t === 'expr') { const opts = shuffle([it.expr, ...others('expr', it)]); q = { html:`‘${esc(it.meaning)}’을(를) 영어로 하면?`, opts, answer: opts.indexOf(it.expr) }; }
    else { const opts = shuffle([it.expr, ...others('expr', it)]); q = { html: esc(it.ex_en).replace(new RegExp(blankRx.source.replace(/'/g, "(?:&#39;|')"), 'i'), '<span class="blank">&nbsp;</span>') + (it.ex_ko ? `<div class="muted small" style="margin-top:6px">${esc(it.ex_ko)}</div>` : ''), opts, answer: opts.indexOf(it.expr) }; }
    q.item = it; qs.push(q);
    if (qs.length >= 10) break;
  }
  return qs;
}

  v.innerHTML = `<div class="quizwrap"><div class="col">${main}</div><div class="col">${side}</div></div>`;
  const st = $('#qStart'); if (st) st.onclick = startQuiz;
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => Store.remove(b.dataset.del));
  v.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openSaved(b.dataset.open));
  const ch = $('#choices');
  if (ch) ch.onclick = e => {
    const b = e.target.closest('.choice'); if (!b || Q.answered) return;
    const q = Q.list[Q.i], pick = +b.dataset.i; Q.answered = true;
    [...ch.children].forEach((c, i) => { c.disabled = true; if (i === q.answer) c.classList.add('right'); else if (i === pick) c.classList.add('wrong'); });
    const ok = pick === q.answer; if (ok) Q.score++; else Q.wrong.push(q.item);
    const fb = $('#fb'); fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'bad');
    fb.textContent = ok ? '정답이에요!' : `정답: ${q.opts[q.answer]}`;
    $('#qNext').hidden = false; $('#qNext').focus();
  };
  const nx = $('#qNext'); if (nx) nx.onclick = () => { Q.i++; Q.answered = false; renderQuiz(); };
}

/* ============ 시작 ============ */
document.addEventListener('error', e => { if (e.target && e.target.tagName === 'IMG') e.target.remove(); }, true);
render();
Store.init();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
